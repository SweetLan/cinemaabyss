apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: cinemaabyss
  labels:
    app: proxy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      imagePullSecrets:
        - name: dockerconfigjson
      containers:
        - name: proxy-service
          image: ghcr.io/sweetlan/cinemaabyss/proxy-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          env:
            - name: PORT
              value: "8000"
            # эти переменные есть в ConfigMap, но оставим явными, чтобы не зависеть от него на 100%
            - name: MONOLITH_URL
              value: http://monolith:8080
            - name: MOVIES_SERVICE_URL
              value: http://movies-service:8081
            - name: EVENTS_SERVICE_URL
              value: http://events-service:8082
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: cinemaabyss
spec:
  selector:
    app: proxy-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
